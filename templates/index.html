<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Classification</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700;800;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .file-upload-contain {
            margin-bottom: 40px;
            text-align: center;
        }

        .file-drop-zone {
            border: 2px dashed #1e80e8;
            padding: 30px;
            border-radius: 20px;
            background-color: #f1f8fe;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-area i {
            color: #1e80e8;
            font-size: 50px;
        }

        .upload-area p {
            font-size: 20px;
            font-weight: 600;
            color: #2580e8;
        }

        .upload-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #1e80e8;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .upload-btn:hover {
            background-color: #007bff;
        }

        .classify-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #f5c70a;
            border: none;
            border-radius: 50px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .classify-btn:hover {
            background-color: #007bff;
            box-shadow: 0px 4px 8px rgba(37, 128, 232, 0.48);
        }

        #uploadedImage {
            max-width: 100%; 
            max-height: 200px; 
            border-radius: 8px; 
            margin-top: 10px; 
            display: none; 
        }

        .result-section {
            text-align: center;
            margin-top: 20px;
        }

        .result-section img {
            max-width: 300px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .result-section p {
            font-size: 18px;
            font-weight: bold;
            color: #1e80e8;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            margin-down: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #28a745;
            border-radius: 50px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .back-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container text-center mb-5 mt-5">
        <h1>Car Prediction</h1>
    </div>

    <section>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-8">
                    <div class="file-upload-contain">
                        <form action="/" method="POST" enctype="multipart/form-data">
                            <div class="file-drop-zone">
                                <div class="upload-area">
                                    <i class="fas fa-upload"></i>
                                    <p>Upload your image here</p>
                                    <img id="uploadedImage" src="" alt="Uploaded Image" style="display: none;" />
                                    <a>
                                        <input type="file" name="file" accept="image/*" required style="display: none;" id="fileInput">
                                        <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click();">Upload</button>
                                        <button type="submit" class="classify-btn">Classify</button>
                                    </a>
                                </div>
                            </div>
                        </form>
                        <div id="result"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    {% if ev_status and subclass_name %}
    <section class="result-section">
        <h2>Prediction Result</h2>
        <div id="result">
            <p>Prediction: {{ ev_status }}</p>
            <p>Subclass: {{ subclass_name }}</p>
        </div>
    </section>
 
    {% endif %}

    <!-- Bootstrap JS and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        document.getElementById('fileInput').onchange = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('uploadedImage');
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
